<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los Santos RP - FiveM Server</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">LOS SANTOS RP</div>
        <nav>
            <a href="index.html" class="active">Sklep & Status</a>
            <a href="admin.html">Panel Admina</a>
        </nav>
    </header>

    <div class="container">
        <!-- Banner z nazwą serwera -->
        <div class="hero">
            <h1>Witaj w Los Santos</h1>
            <p>Dołącz do profesjonalnego serwera RolePlay na platformie FiveM</p>
        </div>

        <!-- Sekcja Statusu Serwera FiveM -->
        <h2>Status Serwera FiveM</h2>
        <div class="server-status-card">
            <div>
                <h3 id="server-name" style="font-size: 1.4rem;">Pobieranie danych serwera...</h3>
                <p id="server-players" style="color: #aaa; margin-top: 5px;">Gracze online: -- / --</p>
            </div>
            <div style="display: flex; align-items: center; gap: 15px;">
                <span id="status-badge" class="status-badge status-offline">Sprawdzanie...</span>
                <a id="connect-link" href="#" class="connect-btn">Połącz (FiveM)</a>
            </div>
        </div>

        <!-- Sekcja Sklepu Dotacji / Usług -->
        <h2>Sklep Serwerowy (Dotacje)</h2>
        <div class="shop-grid" id="products-container">
            <!-- Produkty wczytywane z JavaScript -->
        </div>
    </div>

    <script>
        // --- KONFIGURACJA FIVEM ---
        // Wpisz tutaj ID serwera z FiveM (np. z linku cfx.re/join/xxxxxx -> podaj samo 'xxxxxx')
        const FIVEM_SERVER_ID = "k8p95b"; // Przykład (zmień na własny kod z FiveM)

        // Domyślna oferta FiveM
        const defaultProducts = [
            { id: 1, name: "Pakiet VIP (30 Dni)", price: 20.00, desc: "Dedykowany garaż VIP, dostęp do priorytetu w kolejce (Queue Priority) i wyjątkowy pistolet w skinie." },
            { id: 2, name: "Własna Rejestracja", price: 15.00, desc: "Unikalny napis na tablicy rejestracyjnej dla jednego z Twoich pojazdów." },
            { id: 3, name: "Importowany Pojazd", price: 50.00, desc: "Dostęp do jednorazowego wyboru auta customowego spośród dostępnej listy u opiekuna." }
        ];

        // Pobieranie statusu serwera FiveM przez oficjalne cfx.re API
        async function fetchFiveMStatus() {
            const badge = document.getElementById('status-badge');
            const players = document.getElementById('server-players');
            const name = document.getElementById('server-name');
            const connectBtn = document.getElementById('connect-link');

            connectBtn.href = `fivem://connect/cfx.re/join/${FIVEM_SERVER_ID}`;

            try {
                const response = await fetch(`https://servers-frontend.fivem.net/api/servers/single/${FIVEM_SERVER_ID}`);
                if (!response.ok) throw new Error("Brak odpowiedzi API");
                
                const data = await response.json();
                const serverData = data.Data;

                badge.innerText = "ONLINE";
                badge.className = "status-badge status-online";
                name.innerText = serverData.hostname.replace(/\^[0-9]/g, ''); // Czyszczenie kolorów kolorowania GTA
                players.innerText = `Gracze na wyspie: ${serverData.clients} / ${serverData.sv_maxclients}`;
            } catch (error) {
                badge.innerText = "OFFLINE";
                badge.className = "status-badge status-offline";
                name.innerText = "Serwer Offline lub Błędne ID";
                players.innerText = "Nie udało się połączyć z serwerem.";
            }
        }

        // Renderowanie sklepu
        function loadProducts() {
            const savedProducts = JSON.parse(localStorage.getItem('products')) || defaultProducts;
            const container = document.getElementById('products-container');
            container.innerHTML = '';

            savedProducts.forEach(product => {
                container.innerHTML += `
                    <div class="product-card">
                        <div>
                            <h3>${product.name}</h3>
                            <p>${product.desc}</p>
                        </div>
                        <div>
                            <div class="price">${product.price.toFixed(2)} PLN</div>
                            <button onclick="buyProduct('${product.name}', ${product.price})">Zamów pakiet</button>
                        </div>
                    </div>
                `;
            });
        }

        function buyProduct(name, price) {
            const nick = prompt(`Zamawiasz: ${name} (${price} PLN).\nPodaj swój Nick z Steam / Discord / ID z gry:`);
            if (nick) {
                const orders = JSON.parse(localStorage.getItem('orders')) || [];
                orders.push({
                    id: Date.now(),
                    nick: nick,
                    item: name,
                    price: price,
                    date: new Date().toLocaleString()
                });
                localStorage.setItem('orders', JSON.stringify(orders));
                alert(`Dziękujemy ${nick}! Twoje zgłoszenie zostało zapisane w panelu. Przejdź do kontaktu na Discordzie w celu opłacenia pakietu.`);
            }
        }

        fetchFiveMStatus();
        loadProducts();
    </script>
</body>
</html>
